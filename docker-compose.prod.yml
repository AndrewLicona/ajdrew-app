services:
  # 🔄 Reverse proxy Nginx
  nginx:
    build: ./app/nginx
    container_name: ajdrew-nginx
    ports:
      # Puerto alternativo (8080 está ocupado por otro proyecto)
      - "8081:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - ajdrew-net

  # 🗃️ Base de datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: ajdrew-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-ajdrew_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-ajdrew_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # Puerto único para acceso externo (Estandarizado)
      - "5433:5432"
    restart: unless-stopped
    networks:
      - ajdrew-net

  # 🔴 Redis — cola de publicaciones sociales (BullMQ)
  redis:
    image: redis:7-alpine
    container_name: ajdrew-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ajdrew-net

  # ⚙️ Backend NestJS
  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile.prod
    container_name: ajdrew-backend
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - FRONTEND_URL=${FRONTEND_URL:-https://ajdrew.site}
      - PORT=3000
      - BACKEND_INTERNAL_PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ajdrew-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  # 🌐 Frontend Next.js
  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
        - NEXT_PUBLIC_ENABLE_ADS=${NEXT_PUBLIC_ENABLE_ADS:-false}
        - NEXT_PUBLIC_ADSENSE_PUB_ID=${NEXT_PUBLIC_ADSENSE_PUB_ID:-}
    container_name: ajdrew-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - HOSTNAME=0.0.0.0
      - PORT=80
    ports:
      # Puerto estandarizado para este proyecto
      - "3300:80"
    networks:
      - ajdrew-net
    depends_on:
      - backend

  # 🗂️ Volúmenes y redes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ajdrew-net:
    driver: bridge
