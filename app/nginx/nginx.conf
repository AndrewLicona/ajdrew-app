worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Mínimo log y conexión persistente para desarrollo
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs (puedes cambiarlos a /var/log/nginx/*.log si lo prefieres)
    access_log /dev/stdout;
    error_log /dev/stderr;

    # Resolver interno de Docker (para que nginx resuelva 'frontend' y 'backend')
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name localhost;

        # 🔹 FRONTEND (Next.js)
        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 🔹 BACKEND (NestJS)
        location /api/ {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Opcional: servir assets estáticos del frontend directamente
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            proxy_pass http://frontend:3001;
            expires 1h;
            access_log off;
        }
    }
}
