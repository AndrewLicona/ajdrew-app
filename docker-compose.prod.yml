services:
  # 🔄 Reverse proxy Nginx
  nginx:
    build:
      context: ./app/nginx
    container_name: ajdrew-nginx
    ports:
      - "8081:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - ajdrew-net

  # 🗃️ Base de datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: ajdrew-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-ajdrew_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-ajdrew_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - ajdrew-net

  # ⚙️ Backend NestJS
  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile.prod
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: ajdrew-backend
    command: sh -c "npx prisma db push --accept-data-loss && node -e \"const {PrismaClient}=require('@prisma/client');const bcrypt=require('bcryptjs');const p=new PrismaClient();async function r(){const email=process.env.ADMIN_EMAIL||'admin@eliterankings.com';const pass=process.env.ADMIN_PASSWORD||'admin123';const h=await bcrypt.hash(pass,10);await p.usuario.upsert({where:{email},update:{password:h,rol:'ADMIN'},create:{email,password:h,nombre:'Administrador',rol:'ADMIN'}});console.log('✅ Admin seguro verificado');await p.\$disconnect();}r().catch(console.error);\" && node dist/main.js"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL:-https://ajdrew.site}
      - BACKEND_URL=${BACKEND_URL:-https://ajdrew.site}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-https://ajdrew.site/api/auth/google/callback}
      - YOUTUBE_REDIRECT_URI=${YOUTUBE_REDIRECT_URI:-https://ajdrew.site/api/admin/social/youtube/callback}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-${YOUTUBE_CLIENT_ID:-}}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-${YOUTUBE_CLIENT_SECRET:-}}
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET:-${GOOGLE_CLIENT_SECRET:-}}
      - PORT=3000
      - BACKEND_INTERNAL_PORT=3000
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ajdrew-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  # 🌐 Frontend Next.js
  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://ajdrew.site/api}
        - NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
        - NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET:-ajdrew_unsigned}
        - NEXT_PUBLIC_ENABLE_ADS=${NEXT_PUBLIC_ENABLE_ADS:-false}
        - NEXT_PUBLIC_ADSENSE_PUB_ID=${NEXT_PUBLIC_ADSENSE_PUB_ID:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: ajdrew-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://ajdrew.site/api}
      - HOSTNAME=0.0.0.0
      - PORT=80
    ports:
      - "3300:80"
    networks:
      - ajdrew-net
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local

networks:
  ajdrew-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
