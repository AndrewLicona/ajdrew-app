

services:
  # 🔄 Reverse proxy Nginx
  nginx:
    build: ./app/nginx
    container_name: ajdrew-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - ajdrew-net

  # 🗃️ Base de datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: ajdrew-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-ajdrew_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-ajdrew_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - ajdrew-net

  # ⚙️ Backend NestJS
  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    container_name: ajdrew-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - FRONTEND_URL=http://frontend:3001
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ajdrew-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🌐 Frontend Next.js
  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    container_name: ajdrew-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - PORT=3001
    ports:
      - "3001:3001"
    working_dir: /app/app/frontend
    networks:
      - ajdrew-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 🧭 Prisma Studio
  prisma-studio:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    container_name: prisma-studio
    command: >
      sh -c "cd /app/app/backend && 
             npx prisma studio --hostname 0.0.0.0 --port 5555"
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ajdrew-net

# 🗂️ Volúmenes y redes
volumes:
  postgres_data:
    driver: local

networks:
  ajdrew-net:
    driver: bridge