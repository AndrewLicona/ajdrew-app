services:
  # 🔄 Reverse proxy Nginx
  nginx:
    build: ./app/nginx
    container_name: ajdrew-nginx
    ports:
      # Puerto alternativo (8080 está ocupado por otro proyecto)
      - "8081:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - ajdrew-net

  # 🗃️ Base de datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: ajdrew-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-ajdrew_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-ajdrew_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # Puerto único para acceso externo si necesitas (opcional)
      - "5433:5432"
    restart: unless-stopped
    networks:
      - ajdrew-net

  # ⚙️ Backend NestJS
  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile.prod
    container_name: ajdrew-backend
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/main.js"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-ajdrew}?schema=public
      - FRONTEND_URL=https://ajdrew.andrewlamaquina.my
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ajdrew-net
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 🌐 Frontend Next.js
  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: ajdrew-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - PORT=3001
    ports:
      # Puerto único para este proyecto
      - "3002:3001"
    networks:
      - ajdrew-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  # 🧭 Prisma Studio (Opcional - Comentar si no se usa)
  # prisma-studio:
  #   build:
  #     context: .
  #     dockerfile: app/backend/Dockerfile.prod
  #   container_name: prisma-studio
  #   command: >
  #     sh -c "cd /app/app/backend && 
  #            npx prisma studio --hostname 0.0.0.0 --port 5555"
  #   ports:
  #     - "5556:5555"
  #   environment:
  #     - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - ajdrew-net

  # 🗂️ Volúmenes y redes
volumes:
  postgres_data:
    driver: local

networks:
  ajdrew-net:
    driver: bridge
