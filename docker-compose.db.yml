services:
  db:
    image: postgres:16-alpine
    container_name: ajdrew-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-ajdrew_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - ajdrew-net

networks:
  ajdrew-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
